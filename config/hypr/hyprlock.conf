# PrismOS lock screen: Lilac dark scheme (Material 3 Tonal Spot roles).
# Uses standard documented hyprlock options; verify on a real session (see docs/VALIDATION.md).
general {
    hide_cursor = true
}
background {
    monitor =
    path = screenshot
    color = rgb(141218)
    blur_passes = 3
    blur_size = 6
}
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %-d")"
    color = rgb(cac4cf)
    font_size = 22
    font_family = Roboto
    position = 0, 250
    halign = center
    valign = center
}
label {
    monitor =
    text = $TIME
    color = rgb(e6e1e9)
    font_size = 120
    font_family = Roboto
    position = 0, 130
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 340, 62
    outline_thickness = 3
    dots_size = 0.28
    dots_spacing = 0.3
    dots_center = true
    rounding = -1
    outer_color = rgb(cfbdfe)
    inner_color = rgb(2b292f)
    font_color = rgb(e6e1e9)
    check_color = rgb(efb8c8)
    fail_color = rgb(ffb4ab)
    fail_text = Wrong password
    fade_on_empty = false
    placeholder_text = Enter your password
    position = 0, -80
    halign = center
    valign = center
}
label {
    monitor =
    text = Unlock to continue
    color = rgb(cac4cf)
    font_size = 15
    font_family = Roboto
    position = 0, -150
    halign = center
    valign = center
}
